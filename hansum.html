    this.shishaSent=!!saved.shishaSent; this.drinkSent=!!saved.drinkSent; this.additionalSeq=Number(saved.additionalSeq)||0;
    this.sessionRef=saved.sessionRef||''; this.shishaOrderRef=saved.shishaOrderRef||''; this.drinkOrderRef=saved.drinkOrderRef||'';
    this.otherAddonEnabled=!!saved.otherAddonEnabled;
    if(Array.isArray(saved.sentLog))this.sentLog=saved.sentLog;
    this.tableConfirmed=!!saved.tableConfirmed||!!(saved.order&&saved.order.table&&Number(saved.step)>0);
    if(this.shishaSent && !this.drinkSent && Number(saved.step)>=8)this.step=8;
    else if(this.drinkSent)this.step=11;
    else if(Number.isInteger(saved.step))this.step=Math.min(saved.step,10);
    if(this.order.shishaType)this.setDirections(this.order.shishaType!=='Classic');
    this.clampPreferences();
  }catch(e){console.warn('Could not restore order',e)}
},
clearSavedOrder(){try{localStorage.removeItem('hansumOrderV55')}catch(e){}},
formatPrice(n){return Number(n).toLocaleString('en-US')},
back(){
if(this.step<=0)return;
if(this.step===1){this.step=0;return}
if(this.step===9){this.step=this.drinksFrom||0;return}
if(this.step===10){this.step=9;return}
if(this.step===3&&(this.order.shishaType==='Fruit Head'||this.order.shishaType==='Refill Blonde'||this.order.shishaType==='Refill Dark')){this.step=1;return}
if(this.step===6){this.step=4;return}
this.step--
},
async confirmOrder(){
  if(this.sending)return;
  /* First shisha of the session = the original order. Once it has been sent, every further shisha is a NEW additional order. */
  const additional=this.shishaSent;
  const logTitle=this.orderLogTitle();
  this.sending=true; this.sendMessage='';
  let payload;
  if(additional){
    this.drinkOrderRef=this.additionalRef();
    payload={type:'additional-order',orderRef:this.drinkOrderRef,parentOrderRef:this.shishaOrderRef,additionalNo:this.nextAdditionalNo(),table:this.order.table,order:{...this.order,addons:this.order.addons.map(a=>({...a})),flavorType:this.flavorSummary},subtotal:this.totalPrice,total:this.totalPrice,vatNote:'Prices are exclusive of 8/10% VAT.',createdAt:new Date().toISOString()};
  }else{
    this.shishaOrderRef=this.generateRef('SH');
    payload={type:'shisha',orderRef:this.shishaOrderRef,table:this.order.table,order:{...this.order,flavorType:this.flavorSummary},subtotal:this.totalPrice,total:this.totalPrice,vatNote:'Prices are exclusive of 8/10% VAT.',createdAt:new Date().toISOString()};
  }
  try{
    await this.sendToTelegram(payload);
    if(additional){
      this.additionalSeq=this.nextAdditionalNo();this.drinkSent=true;this.logSent('Additional shisha',this.drinkOrderRef,logTitle,this.totalPrice);this.resetShishaSelection();
      this.sendMessage='';this.step=11;this.persistState();
    }else{
      this.shishaSent=true;this.logSent('Shisha',this.shishaOrderRef,logTitle,this.totalPrice);this.sendMessage='';this.step=8;this.persistState();
    }
  }catch(e){
    console.error(e);this.sendMessage='We could not send the order to our team. Please try again. Your selection is saved on this device.';
  }finally{this.sending=false}
},
/* A new additional order starts here: the previous additional order (if any) is finished, so its "sent" state is cleared. */
startMoreOrder(){this.sendMessage='';this.drinkSent=false;this.drinkOrderRef='';this.drinksFrom=(this.step===8||this.step===11||this.step===0)?this.step:0;this.step=9},
startMoreShisha(){
  this.sendMessage='';this.drinkSent=false;this.drinkOrderRef='';
  if(this.shishaSent)this.resetShishaSelection();
  this.step=1;
},
resetShishaSelection(){
  Object.assign(this.order,{shishaType:'',shishaName:'',price:0,bowl:'',flavorType:'',specific:'',other:'',intensity:5,mint:0,mintiness:0,addons:[],otherAddon:''});
  this.selectedDirections=[];this.flavorDirections=[];this.otherAddonEnabled=false;this.shishaMode='new';
},
nextAdditionalNo(){return (Number(this.additionalSeq)||0)+1},
additionalRef(){
  const base=this.shishaOrderRef||this.generateRef('AD');
  return base+'-A'+String(this.nextAdditionalNo()).padStart(2,'0');
},
addMoreItem(item){
  const existing=this.basket.find(x=>x.name===item.name);
  if(existing)existing.qty++;else this.basket.push({...item,qty:1});
},
async sendFinalOrder(){
  if(this.sending || !this.basketCount || this.drinkSent)return;
  this.sending=true;this.sendMessage='';
  this.drinkOrderRef=this.additionalRef();
  const logTitle=this.basket.map(i=>i.qty+'× '+i.name).join(', '),logTotal=this.basketTotal;
  const payload={type:'additional-order',orderRef:this.drinkOrderRef,parentOrderRef:this.shishaOrderRef,additionalNo:this.nextAdditionalNo(),table:this.order.table,basket:this.basket.map(i=>({...i})),subtotal:this.basketTotal,total:this.basketTotal,vatNote:'Prices are exclusive of 8/10% VAT.',createdAt:new Date().toISOString()};
  try{
    await this.sendToTelegram(payload);
    /* The items are now sent: empty the cart so they can never be sent again with the next additional order. */
    this.additionalSeq=this.nextAdditionalNo();this.drinkSent=true;this.logSent('Drinks',this.drinkOrderRef,logTitle,logTotal);this.basket=[];this.sendMessage='';this.step=11;this.persistState();
  }catch(e){
    console.error(e);this.sendMessage='We could not send the additional order to our team. Please try again. Your items are saved on this device.';
  }finally{this.sending=false}
},
async sendToTelegram(payload){
  const TELEGRAM_ENDPOINT=window.HANSUM_TELEGRAM_ENDPOINT||'';
  if(!TELEGRAM_ENDPOINT) throw new Error('Telegram endpoint is not configured');
  const res=await fetch(TELEGRAM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!res.ok)throw new Error('Telegram endpoint error');
},
finish(){this.clearSavedOrder();window.location.href='index.html'},
initializeQrTable(){
  if(!hasQrTable)return;
  try{
    const raw=localStorage.getItem('hansumOrderV55');
    if(raw){
      const saved=JSON.parse(raw);
      if(saved.order && saved.order.table && String(saved.order.table).toUpperCase()!==qrTable){
        localStorage.removeItem('hansumOrderV55');
        this.order={table:qrTable,shishaType:'',shishaName:'',price:0,bowl:'',flavorType:'',specific:'',other:'',intensity:5,mint:0,mintiness:0,addons:[],otherAddon:''};
        this.basket=[];this.shishaSent=false;this.drinkSent=false;this.additionalSeq=0;this.sessionRef='';this.shishaOrderRef='';this.drinkOrderRef='';this.selectedDirections=[];this.flavorDirections=[];this.otherAddonEnabled=false;this.sentLog=[];this.tableConfirmed=false;this.step=0;
      } else {
        this.restoreState();
        this.order.table=qrTable;
        this.step=0;
      }
    } else {this.order.table=qrTable;this.step=0;}
    this.persistState();
  }catch(e){this.order.table=qrTable;this.step=0;}
}
},
mounted(){
  try{const savedLocale=localStorage.getItem('hansumLocale');if(['en','zh','ko'].includes(savedLocale))this.locale=savedLocale}catch(e){}
  if(hasQrTable)this.initializeQrTable();
  else this.restoreState();
}
}).mount('#app');
</script>
