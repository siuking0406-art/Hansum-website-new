if(this.order.flavorType==='Omakase'||this.order.flavorType==='Specific')return true;
return this.selectedDirections.length>0
},
flavorSummary(){
if(this.order.flavorType==='Signature')return this.order.signatureFlavorName;
if(this.order.flavorType==='Specific')return this.order.specific;
if(this.order.flavorType==='Other')return this.order.other;
if(this.order.flavorType==='Omakase')return 'HANSUM OMAKASE';
return this.selectedDirections.join(' · ')
},
flavorSelectedLabel(){
if(this.order.flavorType==='Other')return this.flavorSummary.trim();
return this.flavorSummary.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase())
},
bowlLabel(){const b=this.order.bowl||'';if(b.indexOf('Egyptian')===0)return 'Egyptian Bowl';if(b.indexOf('Phunnel')===0)return 'Phunnel Bowl';return b},
addonTotal(){return this.order.addons.reduce((s,a)=>s+a.price,0)},
totalPrice(){return this.order.price+this.addonTotal},
grandTotal(){return this.order.price+this.addonTotal+this.basket.reduce((s,i)=>s+i.price*i.qty,0)},
basketTotal(){return this.basket.reduce((s,i)=>s+i.price*i.qty,0)},
basketCount(){return this.basket.reduce((s,i)=>s+i.qty,0)},
  prefMax(){const m=window.HansumOrderAPI&&HansumOrderAPI.prefMax(this.order.shishaType);return m!=null?m:(this.order.shishaType==='Classic'?5:10)},
  displayStep(){return this.step>=6?this.step-1:this.step},
  tableLocked(){return hasQrTable},
  vatLabel(){return this.t('vat')},
  localizedStepNames(){
    const labels={en:{1:'SHISHA',2:'BOWL',3:'FLAVOR',4:'PREFERENCES',5:'COOLING',6:'ADD-ONS',7:'REVIEW'},zh:{1:'水煙',2:'煙碗',3:'風味',4:'偏好',5:'涼感',6:'附加選項',7:'確認'},ko:{1:'시샤',2:'보울',3:'향',4:'선호도',5:'쿨링',6:'추가 옵션',7:'확인'}};
    return labels[this.locale]||labels.en
  }
},
methods:{
  t(key){return (this.translations[this.locale]&&this.translations[this.locale][key])||this.translations.en[key]||key},
  setLocale(locale){this.locale=locale;try{localStorage.setItem('hansumLocale',locale)}catch(e){}},
  categoryTitle(cat){const keys={'Cocktails':'cat_Cocktails','Frozen Series':'cat_FrozenSeries','-86°C Frozen Coffee':'cat_86','Coffee':'cat_Coffee','Shooters':'cat_Shooters','Mocktails & Soft Drinks':'cat_Mocktails','Beer · Soju · Wine':'cat_Beer','Bottle Service':'cat_Bottle'};return this.t(keys[cat.name]||cat.name)},
  scrollToCategory(index){const target=document.getElementById('category-'+index);if(target)target.scrollIntoView({behavior:'smooth',block:'start'})},
  next(){if(this.step<8)this.step++},
clampPreferences(){
  const max=this.prefMax;
  if(this.order.intensity>max)this.order.intensity=max;
  if(this.order.intensity<0)this.order.intensity=0;
  if(this.order.mint>max)this.order.mint=max;
  if(this.order.mint<0)this.order.mint=0;
  if(this.order.mintiness>max)this.order.mintiness=max;
  if(this.order.mintiness<0)this.order.mintiness=0;
},
setPref(field,event){
  let v=Math.round(Number(event.target.value));
  if(!Number.isFinite(v))v=1;
  if(v<0)v=0;
  const max=this.prefMax;
  if(v>max)v=max;
  this.order[field]=v;
  event.target.value=v;
},
nextFromPreferences(){this.clampPreferences();this.step=6},
setDirections(dark){
this.flavorDirections=dark?[
{icon:'🍓',name:'FRUITY',description:'Sweet and easy to enjoy.'},
{icon:'🍋',name:'CITRUS',description:'Bright and zesty.'},
{icon:'🍦',name:'CREAMY',description:'Smooth and dessert-like.'},
{icon:'🌸',name:'FLORAL',description:'Light and elegant.'},
{icon:'🍵',name:'TEA',description:'Aromatic and layered.'},
{icon:'🪵',name:'WOOD',description:'Deep and aromatic.'}
]:[
{icon:'🍓',name:'FRUITY',description:'Sweet and easy to enjoy.'},
{icon:'🍋',name:'CITRUS',description:'Bright and zesty.'},
{icon:'🍦',name:'CREAMY',description:'Smooth and dessert-like.'}
]
if(window.HansumOrderAPI)this.flavorDirections=HansumOrderAPI.directions(dark,this.flavorDirections)},
selectShisha(type,name,price,fruitHead){
Object.assign(this.order,{shishaType:type,shishaName:name,price,bowl:'',flavorType:'',specific:'',other:'',signatureFlavorId:'',signatureFlavorName:''});
this.selectedDirections=[];
this.setDirections(type!=='Classic');
this.clampPreferences();
this.step=(fruitHead||type==='Signature')?3:2
},
selectRefill(name,price,leaf){
Object.assign(this.order,{shishaType:leaf==='Blonde Leaf'?'Refill Blonde':'Refill Dark',shishaName:name,price,bowl:'',flavorType:'',specific:'',other:'',signatureFlavorId:'',signatureFlavorName:''});
this.selectedDirections=[];
this.setDirections(leaf!=='Blonde Leaf');
this.clampPreferences();
this.step=3
},
selectBowl(bowl){this.order.bowl=bowl;this.step=3},
toggleDirection(d){
this.order.flavorType='Direction';this.order.specific='';
const i=this.selectedDirections.indexOf(d);
if(i>-1)this.selectedDirections.splice(i,1);
else if(this.selectedDirections.length<3)this.selectedDirections.push(d);
else this.say('You can blend up to three. Tap one to swap it out.')
},
selectSpecific(f){this.order.flavorType='Specific';this.order.specific=f;this.order.other='';this.selectedDirections=[]},
selectOther(){this.order.flavorType='Other';this.order.specific='';this.selectedDirections=[]},
selectOmakase(){this.order.flavorType='Omakase';this.order.specific='';this.order.other='';this.selectedDirections=[]},
selectSignature(f){Object.assign(this.order,{flavorType:'Signature',signatureFlavorId:f.id,signatureFlavorName:f.name,specific:'',other:''});this.selectedDirections=[];this.step=4},
nextFromFlavor(){if(this.canContinueFlavor)this.step=4},
toggleAddon(a){
const i=this.order.addons.findIndex(x=>x.name===a.name);
if(i>-1)this.order.addons.splice(i,1);else this.order.addons.push({name:a.name,price:a.price})
},
isAddonSelected(n){return this.order.addons.some(a=>a.name===n)},
toggleOtherAddon(){this.otherAddonEnabled=!this.otherAddonEnabled;if(!this.otherAddonEnabled)this.order.otherAddon=''},
itemQty(name){const item=this.basket.find(x=>x.name===name);return item?item.qty:0},
changeQty(item,delta){
  const i=this.basket.findIndex(x=>x.name===item.name);
  if(i<0 && delta>0){this.basket.push({...basketItem(item),qty:1});return}
  if(i<0)return;
  this.basket[i].qty+=delta;
  if(this.basket[i].qty<=0)this.basket.splice(i,1);
},
generateRef(prefix){
  if(this.sessionRef)return `${prefix}-${this.sessionRef}`;
  const d=new Date();
  const stamp=`${String(d.getFullYear()).slice(-2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  this.sessionRef=`${stamp}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
  this.persistState();
  return `${prefix}-${this.sessionRef}`;
},
persistState(){
  orderStore.set(JSON.stringify({step:this.step,order:this.order,selectedDirections:this.selectedDirections,basket:this.basket,shishaSent:this.shishaSent,drinkSent:this.drinkSent,additionalSeq:this.additionalSeq,sessionRef:this.sessionRef,shishaOrderRef:this.shishaOrderRef,drinkOrderRef:this.drinkOrderRef,otherAddonEnabled:this.otherAddonEnabled,sentLog:this.sentLog,tableConfirmed:this.tableConfirmed}));
},
restoreState(){
  try{
    const raw=orderStore.get(); if(!raw)return;
    const saved=JSON.parse(raw);
    if(saved.order)Object.assign(this.order,saved.order);
    if(Array.isArray(saved.selectedDirections))this.selectedDirections=saved.selectedDirections;
    if(Array.isArray(saved.basket))this.basket=saved.basket;
    this.shishaSent=!!saved.shishaSent; this.drinkSent=!!saved.drinkSent; this.additionalSeq=Number(saved.additionalSeq)||0;
    this.sessionRef=saved.sessionRef||''; this.shishaOrderRef=saved.shishaOrderRef||''; this.drinkOrderRef=saved.drinkOrderRef||'';
    this.otherAddonEnabled=!!saved.otherAddonEnabled;
    if(Array.isArray(saved.sentLog))this.sentLog=saved.sentLog;
    this.tableConfirmed=!!saved.tableConfirmed||!!(saved.order&&saved.order.table&&Number(saved.step)>0);
    if(this.shishaSent && !this.drinkSent && Number(saved.step)>=8)this.step=8;
    else if(this.drinkSent)this.step=11;
    else if(Number.isInteger(saved.step))this.step=Math.min(saved.step,10);
    if(this.order.shishaType)this.setDirections(this.order.shishaType!=='Classic');
    this.clampPreferences();
  }catch(e){console.warn('Could not restore order',e)}
},
clearSavedOrder(){orderStore.remove()},
formatPrice(n){return Number(n).toLocaleString('en-US')},
back(){
if(this.step<=0)return;
if(this.step===1){this.step=0;return}
if(this.step===9){this.step=this.drinksFrom||0;return}
if(this.step===10){this.step=9;return}
if(this.step===3&&(this.order.shishaType==='Fruit Head'||this.order.shishaType==='Refill Blonde'||this.order.shishaType==='Refill Dark'||this.order.shishaType==='Signature')){this.step=1;return}
if(this.step===6){this.step=4;return}
this.step--
},
async confirmOrder(){
  if(this.sending)return;
  /* First shisha of the session = the original order. Once it has been sent, every further shisha is a NEW additional order. */
  const additional=this.shishaSent;
  const logTitle=this.orderLogTitle();
  this.sending=true; this.sendMessage='';
  let payload;
  if(additional){
    this.drinkOrderRef=this.additionalRef();
    payload={type:'additional-order',orderRef:this.drinkOrderRef,parentOrderRef:this.shishaOrderRef,additionalNo:this.nextAdditionalNo(),table:this.order.table,branch:this.L.name,order:{...this.order,addons:this.order.addons.map(a=>({...a})),flavorType:this.flavorSummary},subtotal:this.totalPrice,total:this.totalPrice,vatNote:'Prices are exclusive of 8/10% VAT.',createdAt:new Date().toISOString()};
  }else{
    this.shishaOrderRef=this.generateRef('SH');
    payload={type:'shisha',orderRef:this.shishaOrderRef,table:this.order.table,branch:this.L.name,order:{...this.order,flavorType:this.flavorSummary},subtotal:this.totalPrice,total:this.totalPrice,vatNote:'Prices are exclusive of 8/10% VAT.',createdAt:new Date().toISOString()};
  }
  try{
    await this.sendToTelegram(payload);
    if(additional){
      this.additionalSeq=this.nextAdditionalNo();this.drinkSent=true;this.logSent('Additional shisha',this.drinkOrderRef,logTitle,this.totalPrice);this.resetShishaSelection();
      this.sendMessage='';this.step=11;this.persistState();this.scheduleNewOrder();
    }else{
      this.shishaSent=true;this.logSent('Shisha',this.shishaOrderRef,logTitle,this.totalPrice);this.sendMessage='';this.step=8;this.persistState();this.scheduleNewOrder();
    }
  }catch(e){
    console.error(e);this.sendMessage=(e&&e.userMessage)||'We could not send the order to our team. Please try again. Your selection is saved on this device.';
  }finally{this.sending=false}
},
/* A new additional order starts here: the previous additional order (if any) is finished, so its "sent" state is cleared. */
startMoreOrder(){clearTimeout(this._newOrderT);this.sendMessage='';this.drinkSent=false;this.drinkOrderRef='';this.drinksFrom=(this.step===8||this.step===11||this.step===0)?this.step:0;this.step=9},
startMoreShisha(){
  clearTimeout(this._newOrderT);this.sendMessage='';this.drinkSent=false;this.drinkOrderRef='';
  if(this.shishaSent)this.resetShishaSelection();
  this.step=1;
},
resetShishaSelection(){
  Object.assign(this.order,{shishaType:'',shishaName:'',price:0,bowl:'',flavorType:'',specific:'',other:'',intensity:5,mint:0,mintiness:0,addons:[],otherAddon:'',signatureFlavorId:'',signatureFlavorName:''});
  this.selectedDirections=[];this.flavorDirections=[];this.otherAddonEnabled=false;this.shishaMode='new';
  if(window.HansumOrderAPI)HansumOrderAPI.applyDefaults(this.order);
},
/* Manual entry (table chooser, no QR table): after an order is sent, show the confirmation briefly, then start a fresh
   order at Table Selection (shared device). With a QR table the confirmation and "Order more" stay as they are. */
scheduleNewOrder(){if(this.tableLocked||!this.L.chooser)return;clearTimeout(this._newOrderT);this._newOrderT=setTimeout(()=>{if(this.step===8||this.step===11||this.step===0)this.newOrder()},6000)},
newOrder(){
  clearTimeout(this._newOrderT);this.clearSavedOrder();
  this.order={table:hasQrTable?qrTable:'',shishaType:'',shishaName:'',price:0,bowl:'',flavorType:'',specific:'',other:'',intensity:5,mint:0,mintiness:0,addons:[],otherAddon:'',signatureFlavorId:'',signatureFlavorName:''};
  if(window.HansumOrderAPI)HansumOrderAPI.applyDefaults(this.order);
  this.basket=[];this.shishaSent=false;this.drinkSent=false;this.additionalSeq=0;this.sessionRef='';this.shishaOrderRef='';this.drinkOrderRef='';
  this.selectedDirections=[];this.flavorDirections=[];this.otherAddonEnabled=false;this.sentLog=[];this.sendMessage='';this.shishaMode='new';this.drinksFrom=0;this.openCat=0;
  this.tableConfirmed=false;this.step=0;
},
nextAdditionalNo(){return (Number(this.additionalSeq)||0)+1},
additionalRef(){
  const base=this.shishaOrderRef||this.generateRef('AD');
  return base+'-A'+String(this.nextAdditionalNo()).padStart(2,'0');
},
addMoreItem(item){
  const existing=this.basket.find(x=>x.name===item.name);
  if(existing)existing.qty++;else this.basket.push({...basketItem(item),qty:1});
},
async sendFinalOrder(){
  if(this.sending || !this.basketCount || this.drinkSent)return;
  this.sending=true;this.sendMessage='';
  this.drinkOrderRef=this.additionalRef();
  const logTitle=this.basket.map(i=>i.qty+'× '+i.name).join(', '),logTotal=this.basketTotal;
  const payload={type:'additional-order',orderRef:this.drinkOrderRef,parentOrderRef:this.shishaOrderRef,additionalNo:this.nextAdditionalNo(),table:this.order.table,basket:this.basket.map(i=>({...i})),subtotal:this.basketTotal,total:this.basketTotal,vatNote:'Prices are exclusive of 8/10% VAT.',createdAt:new Date().toISOString()};
  try{
    await this.sendToTelegram(payload);
    /* The items are now sent: empty the cart so they can never be sent again with the next additional order. */
    this.additionalSeq=this.nextAdditionalNo();this.drinkSent=true;this.logSent('Drinks',this.drinkOrderRef,logTitle,logTotal);this.basket=[];this.sendMessage='';this.step=11;this.persistState();this.scheduleNewOrder();
  }catch(e){
    console.error(e);this.sendMessage=(e&&e.userMessage)||'We could not send the additional order to our team. Please try again. Your items are saved on this device.';
  }finally{this.sending=false}
},
async sendToTelegram(payload){
  /* Hansum POS first (saved in the POS database, which then notifies Telegram); old Telegram route if it fails. */
  if(window.HansumOrderAPI&&HansumOrderAPI.enabled()){if(await HansumOrderAPI.send(payload))return;payload=HansumOrderAPI.fallbackPayload(payload);}
  const TELEGRAM_ENDPOINT=window.HANSUM_SAIGON_TELEGRAM_ENDPOINT||'';
  if(!TELEGRAM_ENDPOINT) throw new Error('Telegram endpoint is not configured');
  const res=await fetch(TELEGRAM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!res.ok)throw new Error('Telegram endpoint error');
},
finish(){this.clearSavedOrder();window.location.href='index.html'},
initializeQrTable(){
  if(!hasQrTable)return;
  try{
    const raw=orderStore.get();
    if(raw){
      const saved=JSON.parse(raw);
      if(saved.order && saved.order.table && String(saved.order.table).toUpperCase()!==qrTable){
        orderStore.remove();
        this.order={table:qrTable,shishaType:'',shishaName:'',price:0,bowl:'',flavorType:'',specific:'',other:'',intensity:5,mint:0,mintiness:0,addons:[],otherAddon:'',signatureFlavorId:'',signatureFlavorName:''};
        this.basket=[];this.shishaSent=false;this.drinkSent=false;this.additionalSeq=0;this.sessionRef='';this.shishaOrderRef='';this.drinkOrderRef='';this.selectedDirections=[];this.flavorDirections=[];this.otherAddonEnabled=false;this.sentLog=[];this.tableConfirmed=false;this.step=0;
      } else {
        this.restoreState();
        this.order.table=qrTable;
        this.step=0;
      }
    } else {this.order.table=qrTable;this.step=0;}
    this.persistState();
  }catch(e){this.order.table=qrTable;this.step=0;}
}
},
mounted(){
  try{const savedLocale=localStorage.getItem('hansumLocale');if(['en','zh','ko'].includes(savedLocale))this.locale=savedLocale}catch(e){}
  if(hasQrTable)this.initializeQrTable();
  else{this.restoreState();if(this.step===8||this.step===11)this.newOrder();}
  if(window.HansumOrderAPI)HansumOrderAPI.attach(this);
}
}).mount('#app');
</script>
</body>
</html>
